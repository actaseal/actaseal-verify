name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install cryptography pytest
      - name: Run test suite
        run: pytest -q
      - name: Smoke test -- verify committed demo packets
        run: |
          python verify.py demo/demo-packet-unanchored
          python verify.py demo/demo-packet-anchored
      - name: Seal verifier with RFC 3161 timestamp checks
        run: |
          pip install asn1crypto
          pytest -q tests/test_verify_seal_v1.py
          python verify_seal.py conformance/vectors/file_seal_v1/seal_day2.json --base conformance/vectors/file_seal_v1/files --previous conformance/vectors/file_seal_v1/seal_day1.json --public-key 4b315914e216de29066d2563f734d587e816389cceca88dd450389c008e82f0d --tsa-ca conformance/vectors/file_seal_v1/test_tsa_ca.pem --require-timestamp

      - name: Generate SBOM (CycloneDX)
        if: matrix.python-version == '3.12'
        run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements requirements.txt -o sbom.cdx.json

      - name: Upload SBOM
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  # Windows CI for the pure-python offline verifier -- a buyer's dispute
  # team is not guaranteed to run Linux. This repo's conformance set has
  # no PQ vectors, so nothing needs skipping.
  windows-verifier:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography pytest
      - name: Run test suite
        run: pytest -q
      - name: Smoke test -- verify committed demo packets
        run: |
          python verify.py demo/demo-packet-unanchored
          python verify.py demo/demo-packet-anchored
      - name: Run conformance vectors
        run: pytest -q conformance/test_conformance.py
      - name: Seal verifier with RFC 3161 timestamp checks
        run: |
          pip install asn1crypto
          pytest -q tests/test_verify_seal_v1.py
          python verify_seal.py conformance/vectors/file_seal_v1/seal_day2.json --base conformance/vectors/file_seal_v1/files --previous conformance/vectors/file_seal_v1/seal_day1.json --public-key 4b315914e216de29066d2563f734d587e816389cceca88dd450389c008e82f0d --tsa-ca conformance/vectors/file_seal_v1/test_tsa_ca.pem --require-timestamp

  # Confirms the PUBLISHED @actaseal/verify npm package (not this repo's
  # local tamper_demo/ source) actually works when installed fresh from
  # the registry -- distinct from every other job here, which only ever
  # exercises local source. Installs into an isolated temp dir (never
  # this repo's own tamper_demo/, which is what a stray local
  # `npm install @actaseal/verify` run inside that directory previously
  # did by mistake -- self-referential and never what this needed to
  # test). Runs against a known-good demo packet (expect PASS) and a
  # tampered copy (expect FAIL) so a real regression in the published
  # package, not just the source tree, would be caught.
  npm-published-package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the PUBLISHED package into an isolated temp dir
        run: |
          mkdir -p /tmp/actaseal-verify-npm-smoke
          cd /tmp/actaseal-verify-npm-smoke
          npm init -y >/dev/null
          npm install @actaseal/verify
      - name: Verify a known-good packet (expect PASS), then a tampered one (expect FAIL)
        run: |
          node - <<'NODE_EOF'
          const { verifyPacket } = require("/tmp/actaseal-verify-npm-smoke/node_modules/@actaseal/verify");
          const fs = require("fs");
          const path = require("path");

          const packetDir = path.join(__dirname, "demo", "demo-packet-unanchored");
          const manifest = JSON.parse(fs.readFileSync(path.join(packetDir, "manifest.json"), "utf8"));
          const receipt = JSON.parse(fs.readFileSync(path.join(packetDir, "receipt.json"), "utf8"));
          const events = fs.readFileSync(path.join(packetDir, "ledger_slice.ndjson"), "utf8")
            .trim().split("\n").map((line) => JSON.parse(line));

          (async () => {
            const good = await verifyPacket(manifest, receipt, events);
            if (!good.verified) {
              console.error("EXPECTED PASS, GOT FAIL:", good.failures);
              process.exit(1);
            }
            console.log("known-good packet: PASS, as expected");

            const tamperedReceipt = { ...receipt, signature: "00".repeat(64) };
            const tampered = await verifyPacket(manifest, tamperedReceipt, events);
            if (tampered.verified) {
              console.error("EXPECTED FAIL, GOT PASS -- tampered signature was not caught");
              process.exit(1);
            }
            console.log("tampered packet: FAIL, as expected:", tampered.failures);
          })();
          NODE_EOF

  attach-sbom-to-release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cyclonedx-bom
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt -o sbom.cdx.json
      - name: Attach SBOM to release
        uses: softprops/action-gh-release@v2
        with:
          files: sbom.cdx.json
